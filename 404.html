<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | ManBhar Creation</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at 50% 20%, #FFFDF7 0%, #F5ECE0 100%);
      color: #1A120B;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      background: #FFFFFF;
      border: 1.5px solid #C9A24B;
      border-radius: 14px;
      padding: 3rem 2rem;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 12px 36px rgba(94, 11, 27, 0.12);
    }
    .ornament { color: #C9A24B; font-size: 1.5rem; margin-bottom: 0.5rem; }
    h1 {
      font-family: 'Cinzel', serif;
      font-size: 3.5rem;
      color: #5E0B1B;
      line-height: 1;
      margin-bottom: 0.5rem;
    }
    h2 {
      font-family: 'Cinzel', serif;
      font-size: 1.25rem;
      color: #0E382B;
      margin-bottom: 1rem;
    }
    p {
      color: #6E6259;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-block;
      background: #5E0B1B;
      color: #FFFFFF;
      text-decoration: none;
      font-weight: 700;
      padding: 0.85rem 1.8rem;
      border-radius: 50px;
      border: 1px solid #C9A24B;
      transition: all 0.2s ease;
    }
    .btn:hover {
      background: #7A0F24;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(94, 11, 27, 0.25);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="ornament">❖ ❖ ❖</div>
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>Aap jo page dhoondh rahe hain wo uplabdh nahi hai ya URL galat hai.</p>
    <a href="index.html" class="btn">Return to Storefront</a>
  </div>
</body>
</html>
